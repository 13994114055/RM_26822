; MirocFly 传感器配置 - LicheeRV Nano 70415 版 + GC4653 摄像头 (1440p 模式)
; 部署位置: /mnt/data/sensor_cfg.ini (ParseIni 最高优先级)
; 说明: 本镜像 GC4653 驱动只支持 1440p (720p 模式 StartSensor 会失败)
; MIPI: bus=4, i2c addr 0x1d(29), 新版 lane_id=4,3,2

[source]
dev_num = 1

[sensor]
name = GCORE_GC4653_MIPI_4M_30FPS_10BIT
bus_id = 4
sns_i2c_addr = 29
mipi_dev = 0
lane_id = 4, 3, 2, -1, -1
pn_swap = 0, 0, 0, 0, 0
mclk_en = 1
mclk = 1